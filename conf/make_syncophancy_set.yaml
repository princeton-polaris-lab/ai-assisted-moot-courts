##### CLASSIFY METRICS CONFIG -- SBATCH OR HYDRA RUN #####
# 'vllm' or 'openai' or sglang -- triggers switching in models/base.py
model_type: openai
# local path to 'Llama-3.3-70B-Instruct' or 'Qwen3-32B' or "gpt-oss-120b"
model_path: ??
# api-key=<key> on your command line
api_key:

##### HYDRA SLURM SUBMISSION #####
defaults:
  - override hydra/launcher: submitit_slurm

# random seed is index of prompting_strategies!
prompting_strategies:
  - DECORUM
  - SWITCHING_SIDES

# Make sure this number matches the gres value in the hydra-launcher! 
# The normal yaml override won't work
num_gpus: 4

hydra:
  launcher:
    timeout_min: 120
    mem_gb: 8
    gres: gpu:4
    setup:
      - export HYDRA_FULL_ERROR=1
      - module purge
      - module load anaconda3/2024.6
      - conda activate vllm_env